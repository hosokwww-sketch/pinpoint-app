<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PinPoint Core</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: #09090b;
            color: #ececed;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 16px 14px 28px;
            overflow-x: hidden;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .card {
            background: #111114;
            border: 1px solid #1f1f24;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #1a1a1f;
            border: 1px solid #27272f;
            object-cover: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #71717a;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
            display: inline-block;
            margin-right: 4px;
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #71717a;
            margin-bottom: 4px;
        }
        .value {
            font-size: 14px;
            font-weight: 600;
            color: #fafafa;
        }
        .slot-active {
            border-left: 2px solid #fafafa;
        }
        .slot-empty {
            border: 1px dashed #24242b;
            background: #0d0d10;
            text-align: center;
            padding: 20px 14px;
        }
        .key-box {
            background: #09090b;
            border: 1px solid #1f1f24;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 10px 0;
        }
        .key-input {
            background: transparent;
            border: none;
            outline: none;
            color: #a1a1aa;
            font-size: 11px;
            width: 100%;
            pointer-events: none;
        }
        .btn-copy {
            background: #1f1f24;
            color: #fafafa;
            border: 1px solid #2e2e38;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-copy:active {
            background: #2e2e38;
            transform: scale(0.97);
        }
        .btn-action {
            width: 100%;
            background: #18181b;
            color: #d4d4d8;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s ease;
        }
        .btn-action:active {
            background: #27272a;
            color: #fff;
        }
        .btn-primary {
            width: 100%;
            background: #fafafa;
            color: #09090b;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            transition: opacity 0.15s ease;
        }
        .btn-primary:active {
            opacity: 0.85;
        }
        .badge {
            font-size: 10px;
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #27272a;
            padding: 3px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="card header-box">
        <div class="user-block">
            <img id="avatarImg" class="avatar" style="display:none;" alt="">
            <div id="avatarFallback" class="avatar">PP</div>
            <div>
                <div id="uName" class="value" style="font-size: 14px;">CLIENT</div>
                <div id="uId" class="mono" style="font-size: 11px; color: #52525b;">ID: 000000000</div>
            </div>
        </div>
        <div style="text-align: right;">
            <div class="label">Баланс</div>
            <div id="uBal" class="mono" style="font-size: 15px; font-weight: 700; color: #fafafa;">0 ₽</div>
        </div>
    </div>

    <!-- Раздел подписок -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 18px 2px 8px;">
        <span class="label" style="margin: 0;">Слоты устройств</span>
        <span id="slotsCount" class="mono badge">0 / 2 ACTIVE</span>
    </div>

    <div id="slotsBox"></div>

    <button onclick="Telegram.WebApp.close()" class="btn-primary">ЗАКРЫТЬ КАБИНЕТ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        const p = new URLSearchParams(window.location.search);

        const uid = user?.id || p.get('user_id') || '404';
        const uname = user?.username ? '@' + user.username : (user?.first_name || 'CLIENT');
        const photo = user?.photo_url;
        const balance = p.get('bal') || '0';

        document.getElementById('uName').innerText = uname;
        document.getElementById('uId').innerText = `ID: ${uid}`;
        document.getElementById('uBal').innerText = `${balance} ₽`;

        if (photo) {
            const img = document.getElementById('avatarImg');
            img.src = photo;
            img.style.display = 'block';
            document.getElementById('avatarFallback').style.display = 'none';
        } else {
            document.getElementById('avatarFallback').innerText = uname.replace('@', '').charAt(0).toUpperCase();
        }

        let subs = [];
        try {
            const rawSubs = p.get('subs');
            if (rawSubs) subs = JSON.parse(decodeURIComponent(rawSubs));
        } catch (e) {}

        const box = document.getElementById('slotsBox');
        document.getElementById('slotsCount').innerText = `${subs.length} / 2 ACTIVE`;
        let html = '';

        for (let i = 0; i < 2; i++) {
            const s = subs[i];
            if (s) {
                html += `
                    <div class="card slot-active">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span class="status-dot"></span>
                                    <span class="value" style="font-size: 13px;">SLOT #0${i+1}</span>
                                    <span class="badge mono">${s.name}</span>
                                </div>
                                <div class="mono" style="font-size: 11px; color: #71717a; margin-top: 4px;">Срок: до ${s.until}</div>
                            </div>
                        </div>

                        <div class="key-box">
                            <input type="text" id="k_${i}" class="key-input mono" readonly value="${s.key}">
                            <button onclick="copyK('k_${i}', this)" class="btn-copy mono">COPY</button>
                        </div>

                        <button onclick="Telegram.WebApp.close()" class="btn-action mono">
                            ПРОДЛИТЬ ТАРИФ →
                        </button>
                    </div>
                `;
            } else {
                html += `
                    <div class="card slot-empty">
                        <div class="mono" style="font-size: 12px; color: #71717a; margin-bottom: 8px;">[ СЛОТ #0${i+1} НЕ АКТИВЕН ]</div>
                        <button onclick="Telegram.WebApp.close()" class="btn-action mono" style="background: transparent; border-color: #2e2e38;">
                            + ПОДКЛЮЧИТЬ УСТРОЙСТВО
                        </button>
                    </div>
                `;
            }
        }
        box.innerHTML = html;

        function copyK(id, btn) {
            const el = document.getElementById(id);
            navigator.clipboard.writeText(el.value);
            const def = btn.innerText;
            btn.innerText = 'DONE';
            btn.style.background = '#27272a';
            setTimeout(() => {
                btn.innerText = def;
                btn.style.background = '#1f1f24';
            }, 1200);
        }
    </script>
</body>
</html>
